<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RWA Agent</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1410;
    --panel: #161d17;
    --border: #26332a;
    --text: #eaf2ea;
    --muted: #8fa392;
    --accent: #2f7d4f;
    --accent-text: #eafff0;
    --user-bubble: #1f2e22;
    --tool-bubble: #10231a;
    --error: #e5484d;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .sub { font-size: 12px; color: var(--muted); }
  #status { margin-left: auto; font-size: 12px; color: var(--muted); }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .bubble {
    max-width: 72ch;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.5;
    font-size: 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .row.user .bubble { background: var(--accent); color: var(--accent-text); border-radius: 12px 12px 2px 12px; }
  .row.assistant .bubble { background: var(--panel); border: 1px solid var(--border); border-radius: 12px 12px 12px 2px; }
  .row.tool .bubble {
    background: var(--tool-bubble);
    border: 1px dashed var(--border);
    color: var(--muted);
    font-size: 12.5px;
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    border-radius: 10px;
  }
  .row.error .bubble { background: transparent; border: 1px solid var(--error); color: var(--error); border-radius: 10px; }
  #composer {
    display: flex;
    gap: 8px;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
  }
  #input {
    flex: 1;
    resize: none;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    height: 44px;
  }
  #input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #send {
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 10px;
    padding: 0 18px;
    font-size: 14px;
    cursor: pointer;
  }
  #send:disabled { opacity: 0.5; cursor: default; }
  .cursor {
    display: inline-block;
    width: 6px;
    height: 1em;
    background: var(--muted);
    margin-left: 2px;
    vertical-align: -2px;
    animation: blink 1s step-start infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
  <header>
    <h1>RWA Agent</h1>
    <span class="sub">buy-side · devnet</span>
    <span id="status">連線中…</span>
  </header>
  <div id="log"></div>
  <div id="composer">
    <textarea id="input" placeholder="例如：我想投資農業類，中度風險，預算 0.01 SOL" rows="1"></textarea>
    <button id="send">送出</button>
  </div>

<script>
  const log = document.getElementById("log");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const statusEl = document.getElementById("status");

  let sessionId = null;
  let sending = false;

  function addRow(role, text) {
    const row = document.createElement("div");
    row.className = "row " + role;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    row.appendChild(bubble);
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
    return bubble;
  }

  async function refreshStatus() {
    try {
      const res = await fetch("/agent/status");
      const data = await res.json();
      statusEl.textContent = `${data.address.slice(0, 4)}…${data.address.slice(-4)} · ${data.balanceSol} SOL (${data.solanaCluster})`;
    } catch (e) {
      statusEl.textContent = "狀態查詢失敗";
    }
  }

  async function send() {
    const message = input.value.trim();
    if (!message || sending) return;

    sending = true;
    sendBtn.disabled = true;
    input.value = "";
    addRow("user", message);

    let assistantBubble = null;
    let assistantText = "";

    try {
      const res = await fetch("/agent/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, session_id: sessionId }),
      });

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        const parts = buffer.split("\n\n");
        buffer = parts.pop();

        for (const part of parts) {
          const line = part.trim();
          if (!line.startsWith("data:")) continue;
          const event = JSON.parse(line.slice(5).trim());

          if (event.type === "session") {
            sessionId = event.session_id;
          } else if (event.type === "tool_call") {
            addRow("tool", `🔧 ${event.name}(${JSON.stringify(event.arguments)})`);
          } else if (event.type === "tool_result") {
            addRow("tool", `✓ ${event.name} -> ${event.result}`);
          } else if (event.type === "delta") {
            if (!assistantBubble) assistantBubble = addRow("assistant", "");
            assistantText += event.content;
            assistantBubble.textContent = assistantText;
            log.scrollTop = log.scrollHeight;
          } else if (event.type === "error") {
            addRow("error", event.message);
          } else if (event.type === "done") {
            // no-op, stream ends right after
          }
        }
      }
      refreshStatus();
    } catch (e) {
      addRow("error", "連線失敗：" + e.message);
    } finally {
      sending = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }

  sendBtn.addEventListener("click", send);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  refreshStatus();
</script>
</body>
</html>
