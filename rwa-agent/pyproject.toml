[project]
name = "rwa-agent"
version = "0.1.0"
description = "Automated fund-manager AI agent for the RWA fundraising platform: analyzes campaigns via fundraising-api, scores risk, and executes real Solana devnet payments to buy and sell/redeem RWA tokens. Also exposed as an MCP server (app/mcp_server.py)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "openai>=1.50",
    "solana>=0.34",
    "solders>=0.21",
    "mcp>=1.2",
]

[project.scripts]
rwa-agent-mcp = "app.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
