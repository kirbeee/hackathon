[project]
name = "fundraising-api"
version = "0.1.0"
description = "JSON API serving RWA campaign data to the fundraising-frontend and the wallet frontend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "flask>=3.1",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
